name: devlog

on:
  schedule:
    - cron: "45 15 * * *"   # 11:45 PM PHT daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push
        run: |
          git config user.name "janveryuu"
          git config user.email "241925049+janveryuu@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "devlog: $(TZ=Asia/Manila date +%F)"
          git push
